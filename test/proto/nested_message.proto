// This file is used to test the wire formatter class.

syntax = "proto3";

package demo.space;

message message_a 
{
  repeated int32 x   = 1;
  float y   = 2;
  sint64 z  = 3;
}

message message_b 
{
  double u  = 1;
  message_a nested_a = 2;
  int32 v   = 3;
}

message message_c 
{
  message message_d
  {
    repeated uint32 d = 1;
  }

  message_b nested_b = 1;
  message_d nested_d = 2;

  // Deliberate usage before definition to test topsort algorithm.
  message_e.message_g nested_g = 3;
}

message message_e
{
  
  message message_f
  {
    int32 f = 1;
    // Deliberate usage before definition to test topsort algorithm.
    message_g g_in_f = 2; 
  }

  message message_g
  {
    int32 g = 1;
  }

  message_f nested_f = 1;
  message_g nested_g = 2;

}
