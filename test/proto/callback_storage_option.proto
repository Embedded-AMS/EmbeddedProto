// Exercises the dedicated callbackStorage generator option: the repeated scalar field is emitted
// as a concrete ::EmbeddedProto::RepeatedFieldCallback<int32> and serialized EXPANDED, so no
// hand-written template argument is needed and serialize-out works through the generated message.

syntax = "proto3";

import "embedded_proto_options.proto";

package callback_storage_option;

message CallbackOptionMsg
{
  repeated int32 values = 1 [(EmbeddedProto.options).callbackStorage = true];
}
