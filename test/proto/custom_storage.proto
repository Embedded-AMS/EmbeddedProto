// This file is used to test the customStorage option which lets the user supply the storage
// type for repeated, string, bytes and message fields.

syntax = "proto3";

import "embedded_proto_options.proto";

package custom_storage;

message Nested
{
  int32 value = 1;
}

// Each supported field kind with the customStorage option set.
message CustomStorageMsg
{
  repeated uint32 values = 1 [(EmbeddedProto.options).customStorage = true];
  string          text   = 2 [(EmbeddedProto.options).customStorage = true];
  bytes           data   = 3 [(EmbeddedProto.options).customStorage = true];
  Nested          nested = 4 [(EmbeddedProto.options).customStorage = true];
}

// An optional field with the customStorage option.
message OptionalCustomStorageMsg
{
  optional string text = 1 [(EmbeddedProto.options).customStorage = true];
}

// A oneof with a customStorage arm and a regular arm.
message OneofCustomStorageMsg
{
  oneof choice
  {
    string one_text   = 1 [(EmbeddedProto.options).customStorage = true];
    int32  one_scalar = 2;
  }
}
