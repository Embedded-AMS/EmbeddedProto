syntax = "proto3";

package OptionsFromFileSecond;

// A second schema, in its own package, whose options come from the very same
// test/options/embedded_proto_test.options.json as options_from_file.proto.
// One options file serving several schemas is the point of keying it by package
// and message rather than by the location of a *.proto.
//
// Each proto file is generated in its own protoc run, so while this file is
// generated the entries for the other package match nothing. Those are skipped
// rather than reported, which is what lets one file cover a whole product while
// a build compiles only a part of it.
message Reading {
  repeated bytes chunks = 1;
  string unit = 2;

  message Limits {
    repeated uint32 thresholds = 1;
  }

  Limits limits = 3;
}
