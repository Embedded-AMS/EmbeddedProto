syntax = "proto3";

package deep;

// A chain of nested messages used to guard against the serialized size of a
// subtree being calculated more than once per serialization. See PROTO-302.

message level_0
{
  int32 v = 1;
}

message level_1
{
  level_0 child = 1;
}

message level_2
{
  level_1 child = 1;
}

message level_3
{
  level_2 child = 1;
}

message level_4
{
  level_3 child = 1;
}

message level_5
{
  level_4 child = 1;
}

message level_6
{
  level_5 child = 1;
}

message level_7
{
  level_6 child = 1;
}

message level_8
{
  level_7 child = 1;
}
