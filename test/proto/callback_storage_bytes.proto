syntax = "proto3";

import "embedded_proto_options.proto";

package callback_storage_bytes;

// A singular bytes and a singular string field, each streamed through a
// BytesStringCallback via the callbackStorage generator option.
message CallbackBlobMsg
{
  bytes blob = 1 [(EmbeddedProto.options).callbackStorage = true];
  string label = 2 [(EmbeddedProto.options).callbackStorage = true];
}
