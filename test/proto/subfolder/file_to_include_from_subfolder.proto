// This file is used to test including other proto files particular from a subfolder.

syntax = "proto3";

package sub.package;

message other_folder_msg {
  int32 val = 1;
  repeated int32 array = 2;

  enum Nested_Enum {
    NE_A = 0;
    NE_B = 1;
    NE_C = 2;
  }

  Nested_Enum ne = 3;
}

