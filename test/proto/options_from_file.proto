syntax = "proto3";

package OptionsFromFile;

// This file deliberately holds no Embedded Proto options and does not import
// embedded_proto_options.proto. Every option of these fields is supplied by
// test/options/embedded_proto_test.options.json, which stands in for a schema
// that is not yours to edit. That the messages below need no template parameter
// for their length is the proof that the options file was read: without it the
// generated classes would take one.
message Frame {
  repeated int32 samples = 1;
  string name = 2;
  bytes blob = 3;
  repeated string tags = 4;

  message Inner {
    string label = 1;
  }

  Inner inner = 5;
}
