// This file is used to test fields of the well known type google.protobuf.Any.

syntax = "proto3";

import "google/protobuf/any.proto";
import "embedded_proto_options.proto";

package any_test;

// Two unrelated messages which can be packed in an Any.
message Sensor
{
  uint32 id = 1;
  sint32 temperature = 2;
  string name = 3 [(EmbeddedProto.options).maxLength = 8];
}

message Button
{
  bool pressed = 1;
}

// A nested message, its full name includes the enclosing message.
message Nested
{
  message Inner
  {
    uint32 x = 1;
  }
  Inner inner = 1;
}

// The Any as a plain field. The type url and value lengths become template parameters.
message Envelope
{
  uint32 sequence = 1;
  google.protobuf.Any details = 2;
}

// The template parameters of the Any propagate through a nested message.
message Outer
{
  Envelope envelope = 1;
}

// An Any in a repeated field and in a oneof.
message RepeatedAny
{
  repeated google.protobuf.Any items = 1 [(EmbeddedProto.options).maxLength = 2];
}

message OneofAny
{
  oneof payload
  {
    google.protobuf.Any any = 1;
    uint32 number = 2;
  }
}
