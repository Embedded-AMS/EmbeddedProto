// This file is used to test that a proto file declaring protoc custom options can be processed. Declaring custom
// options requires importing google/protobuf/descriptor.proto. Embedded Proto does not generate code for that file,
// the definitions in it are only used by protoc and by other plugins.

syntax = "proto3";

import "google/protobuf/descriptor.proto";

extend google.protobuf.FieldOptions {
  string field_note = 50001;
}

extend google.protobuf.MessageOptions {
  bool message_note = 50002;
}

message CustomOptions {
  option (message_note) = true;

  string name = 1 [(field_note) = "the name of the sensor"];
  int32 value = 2;
  repeated uint32 samples = 3;
}
