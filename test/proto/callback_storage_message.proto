// Element sub-message streamed through a MessageCallback. The outer message with
// the callbackStorage repeated-message field is added alongside once the generator
// emits MessageCallback for it.

syntax = "proto3";

package callback_storage_message;

message Point
{
  int32 x = 1;
  int32 y = 2;
}
