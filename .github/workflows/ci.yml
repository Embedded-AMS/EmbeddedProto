name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - develop

jobs:
  build-test:
    strategy:
      matrix:
        os: [ubuntu-24.04]
        protoc-version: ["32.x"]
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v3
      with:
        submodules: true
    - name: Install Protoc
      uses: arduino/setup-protoc@v2
      with:
        version: ${{ matrix.protoc-version }}
        repo-token: ${{ secrets.GITHUB_TOKEN }}
    - name: Install Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install gcovr
      run: pip install gcovr==7.0
    - name: Build test
      run: ./build_test.sh
    - name: Code coverage
      run: ./code_coverage.sh
